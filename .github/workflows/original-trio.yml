name: Original Trio verification

on:
  pull_request:
    paths:
      - '.github/workflows/original-trio.yml'
      - 'requirements-original-trio*.txt'
      - 'tools/original_trio/**'
      - 'cmd-font-container/latchline-mono/**'
      - 'hot-font-box/diecast-relay/**'
      - 'cachemonic/cache-rattle/**'
      - 'docs/ORIGINAL-TRIO-WORKFLOW.md'
      - 'docs/original-trio-*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/original-trio.yml'
      - 'requirements-original-trio*.txt'
      - 'tools/original_trio/**'
      - 'cmd-font-container/latchline-mono/**'
      - 'hot-font-box/diecast-relay/**'
      - 'cachemonic/cache-rattle/**'
      - 'docs/ORIGINAL-TRIO-WORKFLOW.md'
      - 'docs/original-trio-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-trio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6 opentype-sanitizer
          python -m pip install -r requirements-original-trio.txt -r requirements-original-trio-browser.txt
          python -m playwright install --with-deps chromium
      # Do not rebuild before verification: stale committed exports must fail.
      - name: Verify committed fonts, reproducibility and mandatory OTS
        run: python tools/original_trio/verify.py --require-ots --report "$RUNNER_TEMP/original-trio-verification.json"
      - name: Reject stale specimens
        run: python tools/original_trio/specimen.py --check
      - name: Exercise offline browser testers
        run: python tools/original_trio/browser_smoke.py --report "$RUNNER_TEMP/original-trio-browser-verification.json"
      - name: Confirm verification left the checkout unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
