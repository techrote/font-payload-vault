name: Workshop Six verification

on:
  pull_request:
    paths:
      - '.github/workflows/workshop-six.yml'
      - 'requirements-workshop-six.txt'
      - 'requirements-original-trio*.txt'
      - 'tools/workshop_six/**'
      - 'tools/original_trio/geometry.py'
      - 'tools/original_trio/repertoire.py'
      - 'cmd-font-container/collet-sans/**'
      - 'cmd-font-container/detent-slab/**'
      - 'hot-font-box/flypress/**'
      - 'hot-font-box/ribbon-torque/**'
      - 'cachemonic/anode-bloom/**'
      - 'cachemonic/null-cartridge/**'
      - 'docs/WORKSHOP-SIX-WORKFLOW.md'
      - 'docs/workshop-six-*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/workshop-six.yml'
      - 'requirements-workshop-six.txt'
      - 'requirements-original-trio*.txt'
      - 'tools/workshop_six/**'
      - 'tools/original_trio/geometry.py'
      - 'tools/original_trio/repertoire.py'
      - 'cmd-font-container/collet-sans/**'
      - 'cmd-font-container/detent-slab/**'
      - 'hot-font-box/flypress/**'
      - 'hot-font-box/ribbon-torque/**'
      - 'cachemonic/anode-bloom/**'
      - 'cachemonic/null-cartridge/**'
      - 'docs/WORKSHOP-SIX-WORKFLOW.md'
      - 'docs/workshop-six-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-six-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6 opentype-sanitizer
          python -m pip install -r requirements-workshop-six.txt
          python -m playwright install --with-deps chromium
      # Never rebuild over checked-in exports before checking their freshness.
      - name: Verify committed fonts, reproducibility and mandatory OTS
        run: python tools/workshop_six/verify.py --require-ots --report "$RUNNER_TEMP/workshop-six-verification.json"
      - name: Reject stale specimens
        run: python tools/workshop_six/specimen.py --check
      - name: Exercise six HTTP and file-URL browser testers
        run: python tools/workshop_six/browser_smoke.py --report "$RUNNER_TEMP/workshop-six-browser-verification.json"
      - name: Confirm verification left the checkout unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
