name: Fourth Cohort initial publication

on:
  push:
    branches: [font/fourth-cohort]
    paths:
      - '.bootstrap/fourth-cohort.*.b64'
      - '.github/workflows/fourth-cohort.yml'

permissions:
  contents: write

concurrency:
  group: fourth-cohort-initial-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'techrote/font-payload-vault' && github.ref == 'refs/heads/font/fourth-cohort'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Expand checksummed original text sources
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.bootstrap').glob('fourth-cohort.*.b64'))
          assert [p.name for p in parts] == [f'fourth-cohort.{i:02}.b64' for i in range(1, 7)]
          encoded = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '3ea921752fc0459c5ae8beb09c4d9e3799d0d51b6e505fd4c9e00dd7d0587c94'
          decoded = lzma.decompress(packed)
          assert len(decoded) == 130786
          sources = json.loads(decoded)
          families = ('cmd-font-container/railkey-mono', 'cmd-font-container/gimbal-sans',
                      'cmd-font-container/quoin-serif', 'cmd-font-container/pinfeed-grid',
                      'hot-font-box/flange-banner', 'hot-font-box/broach-black',
                      'hot-font-box/camber-script', 'hot-font-box/octant-cut',
                      'cachemonic/orbit-hatch', 'cachemonic/punchloom',
                      'cachemonic/flux-stitch', 'cachemonic/phase-cairn')
          expected = {'requirements-fourth-cohort.txt'}
          expected |= {f'{p}/source/design.py' for p in families}
          expected |= {f'tools/fourth_cohort/{p}.py' for p in ('common', 'catalog', 'build', 'verify', 'specimen', 'browser_smoke', 'docs')}
          expected |= {f'tools/fourth_cohort/masters/{p}.py' for p in ('rail', 'gimbal', 'quoin', 'pinfeed', 'camber', 'octant')}
          assert len(sources) == 26 and set(sources) == expected
          for name, text in sources.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert isinstance(text, str) and path.suffix in ('.py', '.txt')
              target = Path(name)
              assert not target.exists(), f'Refusing to replace existing file: {name}'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          print('Expanded 26 original UTF-8 source files; no font binaries imported.')
          PY
      - name: Install pinned production and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6 opentype-sanitizer
          python -m pip install -r requirements-fourth-cohort.txt
          python -m playwright install --with-deps chromium
      - name: Build all 24 exports and match the reviewed manifest
        run: |
          python tools/fourth_cohort/build.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('docs/fourth-cohort-manifest.json').read_bytes()).hexdigest()
          print('Hosted manifest SHA-256:', actual)
          assert actual == '143b1b53c64fe02fa93cc2fd4309a92c2d4feb80074562aad3a9b290e328eb1f', 'Hosted fonts/source identities differ from the reviewed build'
          PY
      - name: Generate and check documentation and specimens
        run: |
          python tools/fourth_cohort/docs.py --index
          python tools/fourth_cohort/specimen.py
          python tools/fourth_cohort/docs.py --check
          python tools/fourth_cohort/specimen.py --check
      - name: Qualify all fonts with mandatory OpenType Sanitizer
        run: python tools/fourth_cohort/verify.py --require-ots --report docs/fourth-cohort-verification.json
      - name: Exercise all twelve HTTP and file-URL testers
        run: python tools/fourth_cohort/browser_smoke.py --report docs/fourth-cohort-browser-verification.json
      - name: Require both retained qualification records
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tools/fourth_cohort')
          import verify
          verify.REQUIRE_OTS = True
          verify.REQUIRE_RECORDS = True
          suite = unittest.TestSuite([verify.Qualification('test_20_retained_evidence_bound_to_delivered_bytes')])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Commit qualified new files without altering existing font software
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'README.md', 'cmd-font-container/README.md', 'hot-font-box/README.md', 'cachemonic/README.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          assert changed <= allowed, f'Unexpected changes to existing files: {changed - allowed}'
          for p in allowed:
              old = subprocess.check_output(['git', 'show', f'HEAD:{p}'], text=True)
              with open(p, encoding='utf-8') as f: new = f.read()
              if p != 'README.md': assert new.startswith(old), p
              else: assert old.split('\n', 1)[1].lstrip('\n') in new, p
          PY
          git add README.md cmd-font-container/README.md hot-font-box/README.md cachemonic/README.md
          git add requirements-fourth-cohort.txt tools/fourth_cohort
          git add cmd-font-container/railkey-mono cmd-font-container/gimbal-sans cmd-font-container/quoin-serif cmd-font-container/pinfeed-grid
          git add hot-font-box/flange-banner hot-font-box/broach-black hot-font-box/camber-script hot-font-box/octant-cut
          git add cachemonic/orbit-hatch cachemonic/punchloom cachemonic/flux-stitch cachemonic/phase-cairn
          git add docs/FOURTH-COHORT-WORKFLOW.md docs/fourth-cohort-*.json docs/fourth-cohort-overview.svg
          git rm -- .bootstrap/fourth-cohort.*.b64
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add twelve Fourth Cohort fonts, original masters, design documentation and hosted qualification'
          git push origin HEAD:refs/heads/font/fourth-cohort
