name: Fifth Cohort proof label correction

on:
  push:
    branches: [font/fifth-cohort]
    paths: ['.github/workflows/fifth-cohort.yml']

permissions:
  contents: write

concurrency:
  group: fifth-cohort-initial-publication
  cancel-in-progress: false

jobs:
  correct-label:
    if: github.repository == 'techrote/font-payload-vault' && github.ref == 'refs/heads/font/fifth-cohort'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Correct only the label in generator and generated overview
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, json, subprocess
          from pathlib import Path
          manifest = Path('docs/fifth-cohort-manifest.json')
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == 'd7aeb4b69629e447d0ab21742e123ae0d3d7ab74d408d64f8c4bc3cb7dece10a'
          names = ('tools/fifth_cohort/specimen.py', 'docs/fifth-cohort-overview.svg')
          for name in names:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              assert text.count('FOURTH COHORT') == 1, name
              path.write_text(text.replace('FOURTH COHORT', 'FIFTH COHORT'), encoding='utf-8')
          ast.parse(Path(names[0]).read_text(encoding='utf-8'))
          for family in json.loads(manifest.read_text(encoding='utf-8'))['families']:
              for name, record in family['files'].items():
                  data = Path(name).read_bytes()
                  assert len(data) == record['bytes']
                  assert hashlib.sha256(data).hexdigest() == record['sha256']
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          assert changed == set(names), changed
          print('Only two explanatory labels corrected; every qualified font byte preserved.')
          PY
          git add tools/fifth_cohort/specimen.py docs/fifth-cohort-overview.svg
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use Fifth Cohort consistently in the overview and its generator'
          git push origin HEAD:refs/heads/font/fifth-cohort
