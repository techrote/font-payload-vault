name: Fifth Cohort initial publication

on:
  push:
    branches: [font/fifth-cohort]
    paths:
      - '.github/workflows/fifth-cohort.yml'

permissions:
  contents: write

concurrency:
  group: fifth-cohort-initial-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'techrote/font-payload-vault' && github.ref == 'refs/heads/font/fifth-cohort'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recover reviewed sources into a noncolliding cohort namespace
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin a6ab68b337e81f3822650bf558ca17841cf14e87
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          checkpoint = 'a6ab68b337e81f3822650bf558ca17841cf14e87'
          families = ('cmd-font-container/railkey-mono', 'cmd-font-container/gimbal-sans',
                      'cmd-font-container/quoin-serif', 'cmd-font-container/pinfeed-grid',
                      'hot-font-box/flange-banner', 'hot-font-box/broach-black',
                      'hot-font-box/camber-script', 'hot-font-box/octant-cut',
                      'cachemonic/orbit-hatch', 'cachemonic/punchloom',
                      'cachemonic/flux-stitch', 'cachemonic/phase-cairn')
          names = {'requirements-fourth-cohort.txt'}
          names |= {f'{p}/source/design.py' for p in families}
          names |= {f'tools/fourth_cohort/{p}.py' for p in ('common', 'catalog', 'build', 'verify', 'specimen', 'browser_smoke', 'docs')}
          names |= {f'tools/fourth_cohort/masters/{p}.py' for p in ('rail', 'gimbal', 'quoin', 'pinfeed', 'camber', 'octant')}
          canonical = lambda d: json.dumps(d, sort_keys=True, ensure_ascii=False, separators=(',', ':')).encode()
          sources = {name: subprocess.check_output(['git', 'show', checkpoint + ':' + name]).decode('utf-8') for name in names}
          assert len(sources) == 26
          assert hashlib.sha256(canonical(sources)).hexdigest() == '095ec5ab6d46b41bf85917a9cf7c6b65d9f080b6b0c7abba9f58a0902f1d0afe'
          replacements = (('Fourth Cohort', 'Fifth Cohort'), ('FOURTH-COHORT', 'FIFTH-COHORT'),
                          ('fourth_cohort', 'fifth_cohort'), ('fourth-cohort', 'fifth-cohort'),
                          ('Fifth Cohort / 04', 'Fifth Cohort / 05'))
          def rename(text):
              for before, after in replacements: text = text.replace(before, after)
              return text
          sources = {rename(name): rename(text) for name, text in sources.items()}
          note = '''## Concurrent-main reconciliation

          While these twelve faces were being developed, the independent Gasket Sans,
          Ratchet Block and Phase Drift addition landed on `main` at
          `ce93fb0a477e83dead94d137a62fba507e947cb9` and used the Fourth Cohort namespace.
          That addition is preserved unchanged. These twelve faces therefore publish as
          **Fifth Cohort / 05**, in a separate tools, documentation and evidence namespace.
          Their source-only preparation is retained at
          `a6ab68b337e81f3822650bf558ca17841cf14e87`; this release is rebuilt and qualified
          against the reconciled main base, not merged over the other cohort's files.

          '''
          path = 'tools/fifth_cohort/docs.py'
          anchor = '![Fifth Cohort](fifth-cohort-overview.svg)'
          assert sources[path].count(anchor) == 1
          sources[path] = sources[path].replace(anchor, note + anchor)
          assert hashlib.sha256(canonical(sources)).hexdigest() == '329eca238ec5937e4029ef676a85083b96a12dd25bd63996c84377cba1b89762'
          for name, text in sources.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.suffix in ('.py', '.txt') and '/fonts/' not in name
              target = Path(name)
              assert not target.exists(), f'Refusing to replace existing file: {name}'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          print('Recovered and reconciled 26 exact source files; no existing font or cohort file replaced.')
          PY
      - name: Install pinned production and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6 opentype-sanitizer
          python -m pip install -r requirements-fifth-cohort.txt
          python -m playwright install --with-deps chromium
      - name: Build all 24 exports and match the reviewed manifest
        run: |
          python tools/fifth_cohort/build.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('docs/fifth-cohort-manifest.json').read_bytes()).hexdigest()
          print('Hosted manifest SHA-256:', actual)
          assert actual == 'd7aeb4b69629e447d0ab21742e123ae0d3d7ab74d408d64f8c4bc3cb7dece10a', 'Hosted fonts/source identities differ from the reviewed build'
          PY
      - name: Generate and check documentation and specimens
        run: |
          python tools/fifth_cohort/docs.py --index
          python tools/fifth_cohort/specimen.py
          python tools/fifth_cohort/docs.py --check
          python tools/fifth_cohort/specimen.py --check
      - name: Qualify all fonts with mandatory OpenType Sanitizer
        run: python tools/fifth_cohort/verify.py --require-ots --report docs/fifth-cohort-verification.json
      - name: Exercise all twelve HTTP and file-URL testers
        run: python tools/fifth_cohort/browser_smoke.py --report docs/fifth-cohort-browser-verification.json
      - name: Require both retained qualification records
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tools/fifth_cohort')
          import verify
          verify.REQUIRE_OTS = True
          verify.REQUIRE_RECORDS = True
          suite = unittest.TestSuite([verify.Qualification('test_20_retained_evidence_bound_to_delivered_bytes')])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Commit qualified new files without altering existing font software
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'README.md', 'cmd-font-container/README.md', 'hot-font-box/README.md', 'cachemonic/README.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          assert changed <= allowed, f'Unexpected changes to existing files: {changed - allowed}'
          for p in allowed:
              old = subprocess.check_output(['git', 'show', f'HEAD:{p}'], text=True)
              with open(p, encoding='utf-8') as f: new = f.read()
              if p != 'README.md': assert new.startswith(old), p
              else: assert old.split('\n', 1)[1].lstrip('\n') in new, p
          PY
          git add README.md cmd-font-container/README.md hot-font-box/README.md cachemonic/README.md
          git add requirements-fifth-cohort.txt tools/fifth_cohort
          git add cmd-font-container/railkey-mono cmd-font-container/gimbal-sans cmd-font-container/quoin-serif cmd-font-container/pinfeed-grid
          git add hot-font-box/flange-banner hot-font-box/broach-black hot-font-box/camber-script hot-font-box/octant-cut
          git add cachemonic/orbit-hatch cachemonic/punchloom cachemonic/flux-stitch cachemonic/phase-cairn
          git add docs/FIFTH-COHORT-WORKFLOW.md docs/fifth-cohort-*.json docs/fifth-cohort-overview.svg
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add twelve Fifth Cohort fonts, original masters, design documentation and hosted qualification'
          git push origin HEAD:refs/heads/font/fifth-cohort
