name: Third Cohort verification

on:
  pull_request:
    paths:
      - '.github/workflows/third-cohort.yml'
      - 'requirements-*.txt'
      - 'tools/third_cohort/**'
      - 'cmd-font-container/tracebar-mono/**'
      - 'cmd-font-container/bushing-sans/**'
      - 'cmd-font-container/microslab/**'
      - 'cmd-font-container/nibble-nine/**'
      - 'hot-font-box/torque-plate/**'
      - 'hot-font-box/sling-arc/**'
      - 'hot-font-box/swarf-bridge/**'
      - 'hot-font-box/raster-forge/**'
      - 'cachemonic/shift-ghost/**'
      - 'cachemonic/eddy-notch/**'
      - 'cachemonic/carbon-check/**'
      - 'cachemonic/checksum-haze/**'
      - 'docs/third-cohort-*'
      - 'docs/THIRD-COHORT-WORKFLOW.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/third-cohort.yml'
      - 'requirements-*.txt'
      - 'tools/third_cohort/**'
      - 'cmd-font-container/tracebar-mono/**'
      - 'cmd-font-container/bushing-sans/**'
      - 'cmd-font-container/microslab/**'
      - 'cmd-font-container/nibble-nine/**'
      - 'hot-font-box/torque-plate/**'
      - 'hot-font-box/sling-arc/**'
      - 'hot-font-box/swarf-bridge/**'
      - 'hot-font-box/raster-forge/**'
      - 'cachemonic/shift-ghost/**'
      - 'cachemonic/eddy-notch/**'
      - 'cachemonic/carbon-check/**'
      - 'cachemonic/checksum-haze/**'
      - 'docs/third-cohort-*'
      - 'docs/THIRD-COHORT-WORKFLOW.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: third-cohort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned sanitizer, fonts and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype6 opentype-sanitizer
          python -m pip install -r requirements-third-cohort.txt
          python -m playwright install --with-deps chromium
      # Do not rebuild over committed binaries before checking their exact hashes.
      - name: Verify exact committed contours, bytes, reproducibility and mandatory OTS
        run: python tools/third_cohort/verify.py --require-ots --report "$RUNNER_TEMP/third-cohort-verification.json"
      - name: Reject stale specimen outputs
        run: python tools/third_cohort/specimen.py --check
      - name: Verify twelve HTTP and file-URL local testers
        run: python tools/third_cohort/browser_smoke.py --report "$RUNNER_TEMP/third-cohort-browser-verification.json"
      - name: Confirm test checkout was not modified
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
